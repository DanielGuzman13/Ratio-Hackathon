# Producción local con PostgreSQL:  docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ratio
      POSTGRES_PASSWORD: ratio
      POSTGRES_DB: ratio
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratio"]
      interval: 3s
      retries: 10
  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://ratio:ratio@db:5432/ratio
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
