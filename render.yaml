# Despliegue en Render (render.com): New > Blueprint > elige este repositorio.
# Las claves (sync: false) se escriben en el panel de Render, nunca en GitHub.
services:
  - type: web
    name: ratio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL_GENERATOR
        sync: false
      - key: AI_REASONING_EFFORT
        sync: false
